# OmniBridge default configuration
# All values here can be overridden by environment variables.

server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

database:
  path: "./data/omnibridge.db"

admin:
  username: "admin"
  password: "changeme"
  secret_key: "supersecretkey-change-in-production"

providers:
  gemini:
    enabled: true
    cookie_refresh_interval: 3300   # seconds (55 min — refresh before 60 min expiry)
    request_timeout: 60
    max_retries: 3
    models:
      - id: "gemini-3.8-flash"
        display_name: "Gemini 3.8 Flash (Antigravity High-Speed)"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-3.7-flash"
        display_name: "Gemini 3.7 Flash (Antigravity Hybrid Fast)"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-3.6-flash"
        display_name: "Gemini 3.6 Flash (Antigravity)"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-3.1-pro"
        display_name: "Gemini 3.1 Pro (Antigravity Deep Reasoning)"
        context_window: 2000000
        supports_vision: true
      - id: "gemini-3.5-flash-lite"
        display_name: "Gemini 3.5 Flash-Lite (Fastest)"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-pro-extended"
        display_name: "Gemini Pro Extended (Thinking)"
        context_window: 2000000
        supports_vision: true
      - id: "gemini-2.5-pro"
        display_name: "Gemini 2.5 Pro (Flagship Reasoning & Coding)"
        context_window: 2000000
        supports_vision: true
      - id: "gemini-2.5-flash"
        display_name: "Gemini 2.5 Flash (Ultra Fast & Capable)"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-2.0-flash-thinking-exp"
        display_name: "Gemini 2.0 Flash Thinking Exp (Step-by-Step Thought)"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-2.0-pro-exp"
        display_name: "Gemini 2.0 Pro Experimental"
        context_window: 2000000
        supports_vision: true
      - id: "gemini-2.0-flash"
        display_name: "Gemini 2.0 Flash"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-1.5-pro"
        display_name: "Gemini 1.5 Pro"
        context_window: 2000000
        supports_vision: true
      - id: "gemini-1.5-flash"
        display_name: "Gemini 1.5 Flash"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-1.5-flash-8b"
        display_name: "Gemini 1.5 Flash 8B (Lightweight)"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-exp-1206"
        display_name: "Gemini 1206 Experimental"
        context_window: 2000000
        supports_vision: true

  deepseek:
    enabled: true
    request_timeout: 90
    max_retries: 3
    models:
      - id: "deepseek-chat"
        display_name: "DeepSeek Chat (V3)"
        context_window: 64000
        supports_vision: false
      - id: "deepseek-reasoner"
        display_name: "DeepSeek Reasoner (R1 - Thinking)"
        context_window: 64000
        supports_vision: false

  chatgpt:
    enabled: true
    request_timeout: 90
    max_retries: 3
    models:
      - id: "gpt-4o"
        display_name: "ChatGPT GPT-4o"
        context_window: 128000
        supports_vision: true
      - id: "gpt-4o-mini"
        display_name: "ChatGPT GPT-4o-mini"
        context_window: 128000
        supports_vision: true
      - id: "o1-mini"
        display_name: "ChatGPT o1-mini (Reasoning)"
        context_window: 128000
        supports_vision: false
      - id: "o3-mini"
        display_name: "ChatGPT o3-mini (Reasoning)"
        context_window: 128000
        supports_vision: false
      - id: "chatgpt-auto"
        display_name: "ChatGPT Auto"
        context_window: 128000
        supports_vision: true
