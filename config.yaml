# OmniBridge default configuration
# All values here can be overridden by environment variables.

server:
  host: "0.0.0.0"
  port: 8080
  log_level: "info"

database:
  path: "./data/omnibridge.db"

admin:
  username: "admin"
  password: "changeme"
  secret_key: "supersecretkey-change-in-production"

providers:
  gemini:
    enabled: true
    cookie_refresh_interval: 3300   # seconds (55 min — refresh before 60 min expiry)
    request_timeout: 60
    max_retries: 3
    models:
      - id: "gemini-3.5-flash-lite"
        display_name: "Gemini 3.5 Flash-Lite (Fastest)"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-3.6-flash"
        display_name: "Gemini 3.6 Flash (All-around)"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-3.1-pro"
        display_name: "Gemini 3.1 Pro (Advanced Math & Code)"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-pro-extended"
        display_name: "Gemini Pro Extended (Thinking)"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-3-pro"
        display_name: "Gemini 3 Pro"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-3-flash"
        display_name: "Gemini 3 Flash"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-2.5-pro"
        display_name: "Gemini 2.5 Pro"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-2.5-flash"
        display_name: "Gemini 2.5 Flash"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-1.5-pro"
        display_name: "Gemini 1.5 Pro"
        context_window: 1000000
        supports_vision: true
      - id: "gemini-1.5-flash"
        display_name: "Gemini 1.5 Flash"
        context_window: 1000000
        supports_vision: true
