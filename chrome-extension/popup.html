<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>OmniBridge Auto-Sync</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');

    :root {
      --bg-main: #090d16;
      --bg-card: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-cyan: #38bdf8;
      --accent-blue: #2563eb;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, sans-serif;
    }

    body {
      width: 350px;
      padding: 16px;
      background: var(--bg-main);
      color: #f8fafc;
      font-size: 13px;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }
    .logo-badge img {
      width: 20px;
      height: 20px;
    }
    .header h1 {
      font-size: 14.5px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.2px;
    }
    .header .version {
      font-size: 10px;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 999px;
      direction: ltr;
    }

    /* Status Banner */
    .status-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .status-label {
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
    }
    .badge-green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-red { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-yellow { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    /* Cookie Inspection Section */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cookie-list {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .cookie-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
    }
    .cookie-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: monospace;
      direction: ltr;
      color: #cbd5e1;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .dot-green { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .dot-red { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }

    .open-link {
      font-size: 10.5px;
      color: var(--accent-cyan);
      text-decoration: none;
      cursor: pointer;
    }
    .open-link:hover {
      text-decoration: underline;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 7px 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 7px;
      color: #f8fafc;
      font-size: 12px;
      direction: ltr;
      text-align: left;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }

    /* Action Button */
    .btn-sync {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      margin-top: 6px;
    }
    .btn-sync:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-sync:disabled {
      background: #334155;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* Toast */
    #toast-msg {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      display: none;
      padding: 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo-badge">
        <img src="icons/icon48.png" alt="Logo" />
      </div>
      <div>
        <h1>همگام‌ساز خودکار کوکی</h1>
      </div>
    </div>
    <span class="version">v1.1</span>
  </div>

  <!-- Status Card -->
  <div class="status-card">
    <div class="status-row">
      <span class="status-label">وضعیت اتصال به سرور:</span>
      <span id="sync-badge" class="badge badge-yellow">در حال بررسی...</span>
    </div>
    <div class="status-row">
      <span class="status-label">آخرین سینک موفق:</span>
      <span id="last-sync-time" style="color: #cbd5e1; direction: ltr; font-size: 11px;">-</span>
    </div>
  </div>

  <!-- Detected Cookies in Browser -->
  <div class="section-title">وضعیت کوکی‌های موجود در مرورگر شما</div>
  <div class="cookie-list">
    <div class="cookie-item">
      <div class="cookie-name">
        <span id="dot-psid" class="dot dot-red"></span>
        <span>__Secure-1PSID</span>
      </div>
      <span id="val-psid" style="font-size: 10px; color: var(--text-muted); direction: ltr;">یافت نشد</span>
    </div>
    <div class="cookie-item">
      <div class="cookie-name">
        <span id="dot-psidts" class="dot dot-red"></span>
        <span>__Secure-1PSIDTS</span>
      </div>
      <span id="val-psidts" style="font-size: 10px; color: var(--text-muted); direction: ltr;">یافت نشد</span>
    </div>
    <div style="margin-top: 3px; display: flex; justify-content: flex-end;">
      <a class="open-link" id="link-open-gemini">🔗 باز کردن gemini.google.com</a>
    </div>
  </div>

  <!-- Server Config -->
  <div class="form-group">
    <label for="server-url">آدرس سرور OmniBridge (Render):</label>
    <input id="server-url" type="text" placeholder="https://free-gemini-pro-api-me28.onrender.com" />
  </div>

  <div class="form-group">
    <label for="api-key">کلید امنیتی API Key:</label>
    <input id="api-key" type="password" placeholder="sk-omni-..." />
  </div>

  <!-- Sync Button -->
  <button id="sync-btn" class="btn-sync">
    <span>🔄</span>
    <span>همگام‌سازی فوری کوکی‌ها</span>
  </button>

  <div id="toast-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
