name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t omnibridge:ci .

    - name: Smoke test Docker image
      run: |
        docker run -d --name omnibridge-test -p 8080:8000 \
          -e ADMIN_PASSWORD=ci-test-password \
          -e ADMIN_SECRET_KEY=ci-test-secret-key-32chars-long!! \
          omnibridge:ci
        sleep 5
        curl -sf http://localhost:8080/health || (docker logs omnibridge-test && exit 1)
        docker stop omnibridge-test
